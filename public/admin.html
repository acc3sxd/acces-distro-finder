<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Admin Paneli</title>
  <style>
    body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #2a2a2a; padding: 30px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { width: 100%; padding: 10px; margin-top: 15px; border-radius: 4px; border: none; font-size: 14px; box-sizing: border-box; }
    input { background: #333; color: #fff; border: 1px solid #444; }
    button { background: #e74c3c; color: #white; font-weight: bold; cursor: pointer; }
    button:hover { background: #c0392b; }
    table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 8px; border-bottom: 1px solid #444; }
  </style>
</head>
<body>

  <div class="box" id="login-box">
    <h2>Admin Girişi</h2>
    <input type="password" id="pass" placeholder="Şifre">
    <button onclick="login()">Giriş Yap</button>
  </div>

  <div class="box" id="panel-box" style="display:none; width: 600px;">
    <h2>Lisans Yönetimi</h2>
    <input type="number" id="rights" value="100" placeholder="Hak sayısı">
    <button onclick="generateKey()" style="background: #2ecc71;">Key Üret</button>
    <table>
      <thead><tr><th>Key Kodu</th><th>Hak</th><th>İşlem</th></tr></thead>
      <tbody id="keys-list"></tbody>
    </table>
    <button onclick="location.reload()" style="background: #555; margin-top: 20px;">Çıkış Yap</button>
  </div>

  <script>
    let token = '';
    async function login() {
      token = document.getElementById('pass').value;
      const res = await fetch('/api/admin/keys', { headers: { 'x-admin-password': token } });
      if (res.ok) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel-box').style.display = 'block';
        loadKeys();
      } else {
        alert('Hatalı Şifre!');
      }
    }

    async function loadKeys() {
      const res = await fetch('/api/admin/keys', { headers: { 'x-admin-password': token } });
      const keys = await res.json();
      const tbody = document.getElementById('keys-list');
      tbody.innerHTML = '';
      for (const [k, v] of Object.entries(keys)) {
        tbody.innerHTML += `<tr><td>${k}</td><td>${v}</td><td><button onclick="deleteKey('${k}')" style="background:#c0392b; padding:4px 8px; margin:0;">Sil</button></td></tr>`;
      }
    }

    async function generateKey() {
      const rights = document.getElementById('rights').value;
      const res = await fetch('/api/admin/generate-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': token },
        body: JSON.stringify({ rights: parseInt(rights) })
      });
      const data = await res.json();
      if (data.success) {
        alert('Oluşturulan Key: ' + data.key);
        loadKeys();
      }
    }

    async function deleteKey(key) {
      await fetch('/api/admin/delete-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': token },
        body: JSON.stringify({ key })
      });
      loadKeys();
    }
  </script>
</body>
</html>
