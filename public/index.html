<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acces Distro Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #121212; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #ff3333; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .tabs { display: flex; margin-bottom: 20px; background: #121212; border-radius: 6px; padding: 3px; border: 1px solid #2a2a2a; }
    .tab { flex: 1; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; color: #888; background: transparent; border: none; transition: 0.2s; }
    .tab.active { background: #2a2a2a; color: #ff3333; }
    
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: 500; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #121212;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #ff3333; }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #ff3333;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn:hover { background-color: #e02424; }
    .btn-secondary { background-color: #333; color: #aaa; margin-top: 15px; }
    .btn-secondary:hover { background-color: #444; color: #fff; }
    .btn-claim { background-color: #2563eb; margin-top: 8px; }
    .btn-claim:hover { background-color: #1d4ed8; }
    .btn-buy { background-color: #10b981; margin-top: 8px; }
    .btn-buy:hover { background-color: #059669; }

    .info-box { background: #121212; padding: 12px; border-radius: 6px; border: 1px solid #2a2a2a; margin-bottom: 15px; text-align: left; font-size: 13px; }
    .info-box div { margin-bottom: 4px; color: #aaa; }
    .info-box span { color: #ff3333; font-weight: bold; }

    .form-container { display: none; }
    .form-container.active { display: block; }
    #app-screen { display: none; }
    .msg { font-size: 12px; margin-top: 8px; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
  </style>
</head>
<body>

  <div class="card" id="auth-card">
    <h1>🎧 Acces Distro Finder</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Giriş Yap</button>
      <button class="tab" onclick="switchTab('register')">Kayıt Ol</button>
    </div>

    <div class="form-container active" id="login-form">
      <div class="input-group">
        <label>E-Mail Adresi</label>
        <input type="email" id="login-email" placeholder="ornek@mail.com">
      </div>
      <div class="input-group">
        <label>Şifre</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn" onclick="loginUser()">Giriş Yap</button>
      <div class="msg error" id="login-msg"></div>
    </div>

    <div class="form-container" id="register-form">
      <div class="input-group">
        <label>E-Mail Adresi</label>
        <input type="email" id="reg-email" placeholder="ornek@mail.com">
      </div>
      <div class="input-group">
        <label>Şifre</label>
        <input type="password" id="reg-password" placeholder="••••••••">
      </div>
      <button class="btn" onclick="registerUser()">Kayıt Ol</button>
      <div class="msg" id="reg-msg"></div>
    </div>
  </div>

  <div class="card" id="app-screen">
    <h1>🎧 Acces Distro Finder</h1>
    
    <div class="info-box">
      <div>Mail: <span id="txt-email">-</span></div>
      <div>Kalan Hak: <span id="txt-rights">0</span></div>
    </div>

    <div class="input-group">
      <input type="text" id="query-input" placeholder="https://open.spotify.com/track/...">
    </div>
    <button class="btn" onclick="makeQuery()">Distribütörü Yakala</button>
    
    <div id="result-area" style="margin-top: 12px; text-align: left; font-size: 13px; color: #51cf66; word-break: break-all;"></div>
    
    <button class="btn btn-claim" onclick="requestFreeRights()">Hak Talep Et (Ücretsiz)</button>
    <div id="claim-msg" class="msg"></div>

    <button class="btn btn-buy" onclick="buyRights()">Hak Satın Al (Pro Paket)</button>
    
    <button class="btn btn-secondary" onclick="logout()">Çıkış Yap</button>
  </div>

  <script>
    let currentUser = localStorage.getItem('user_email') || '';

    if (currentUser) {
      openDashboard(currentUser);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
      
      if (tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    async function registerUser() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const msg = document.getElementById('reg-msg');

      if (!email || !password) {
        msg.className = 'msg error';
        msg.innerText = 'Tüm alanları doldurmalısın!';
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = 'msg success';
          msg.innerText = 'Kayıt başarılı! Giriş yapabilirsin.';
          setTimeout(() => switchTab('login'), 1500);
        } else {
          msg.className = 'msg error';
          msg.innerText = data.message || 'Kayıt başarısız!';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.innerText = 'Bağlantı hatası!';
      }
    }

    async function loginUser() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const msg = document.getElementById('login-msg');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('user_email', email);
          openDashboard(email);
        } else {
          msg.innerText = data.message || 'Hatalı mail veya şifre!';
        }
      } catch (err) {
        msg.innerText = 'Bağlantı hatası!';
      }
    }

    async function openDashboard(email) {
      document.getElementById('auth-card').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      document.getElementById('txt-email').innerText = email;

      const res = await fetch('/api/user-info?email=' + encodeURIComponent(email));
      const data = await res.json();
      if (data.success) {
        document.getElementById('txt-rights').innerText = data.rights;
      }
    }

    async function makeQuery() {
      const query = document.getElementById('query-input').value;
      const email = localStorage.getItem('user_email');
      const res = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, query })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('txt-rights').innerText = data.remainingRights;
        document.getElementById('result-area').innerText = data.result;
      } else {
        alert(data.message || 'Sorgu başarısız!');
      }
    }

    async function requestFreeRights() {
      const email = localStorage.getItem('user_email');
      const claimMsg = document.getElementById('claim-msg');
      
      const res = await fetch('/api/request-rights', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if (data.success) {
        claimMsg.className = 'msg success';
        claimMsg.innerText = 'Ücretsiz hak talebiniz admin paneline iletildi!';
      } else {
        claimMsg.className = 'msg error';
        claimMsg.innerText = 'Talep gönderilemedi!';
      }
    }

    function buyRights() {
      window.open('https://www.shopier.com/', '_blank');
    }

    function logout() {
      localStorage.removeItem('user_email');
      location.reload();
    }
  </script>
</body>
</html>
