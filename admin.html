<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acces Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .admin-card { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 650px; border: 1px solid #334155; }
    h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; text-align: center; }
    .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; margin-bottom: 15px; }
    button { padding: 10px 15px; border: none; border-radius: 6px; background-color: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .btn-create { width: 100%; padding: 12px; background-color: #22c55e; color: #fff; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
    th { color: #38bdf8; }
    .btn-delete { background-color: #ef4444; color: #fff; margin-left: 5px; }
    .btn-copy { background-color: #334155; color: #38bdf8; }
    #login-form, #admin-content { display: none; }

    /* ŞIK POPUP KUTUSU (MODAL) */
    .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:99999; }
    .modal-box { background: #1e293b; padding: 25px; border-radius: 12px; border: 2px solid #38bdf8; text-align: center; max-width: 400px; width: 90%; }
    .key-box { background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 20px; padding: 15px; margin: 15px 0; border-radius: 6px; border: 1px dashed #38bdf8; word-break: break-all; font-weight: bold; }
  </style>
</head>
<body>

  <div class="admin-card">
    <div id="login-form">
      <h1>👑 Admin Girişi</h1>
      <label>Admin Şifresi</label>
      <input type="password" id="admin-pass" placeholder="Şifre">
      <button class="btn-create" onclick="login()">Giriş Yap</button>
    </div>

    <div id="admin-content">
      <h1>👑 Acces Admin Panel</h1>
      <div class="section">
        <h3>🔑 Yeni Key Üret</h3>
        <br>
        <label>Verilecek Sorgu Hakkı</label>
        <input type="number" id="rights-count" value="100">
        <button class="btn-create" onclick="generateKey()">Key Oluştur</button>
      </div>

      <div>
        <h3>🔑 Sistemdeki Key'ler</h3>
        <table>
          <thead>
            <tr><th>Key</th><th>Hak</th><th>İşlemler</th></tr>
          </thead>
          <tbody id="keys-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- UYARISIZ POPUP KUTUSU -->
  <div class="modal-bg" id="key-modal">
    <div class="modal-box">
      <h2 style="color:#22c55e;">🎉 Key Üretildi!</h2>
      <div class="key-box" id="modal-key-val">ACCES-KEY-XXXX</div>
      <button class="btn-create" onclick="copyModalKey()" id="copy-btn-text">📋 Kopyala</button>
      <button style="background:#64748b; color:#fff; width:100%; margin-top:8px;" onclick="closeModal()">Kapat</button>
    </div>
  </div>

  <script>
    let adminToken = '';

    function login() {
      adminToken = document.getElementById('admin-pass').value;
      loadKeys();
    }

    async function loadKeys() {
      try {
        const res = await fetch('/api/admin/keys', { headers: { 'x-admin-password': adminToken } });
        if (!res.ok) return alert('Hatalı Şifre!');
        
        const keys = await res.json();
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';

        const tbody = document.getElementById('keys-table');
        tbody.innerHTML = '';

        Object.keys(keys).forEach(key => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><code>${key}</code></td>
            <td>${keys[key]} Hak</td>
            <td>
              <button class="btn-copy" onclick="copyText('${key}')">📋 Kopyala</button>
              <button class="btn-delete" onclick="deleteKey('${key}')">❌ İptal Et</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) { alert('Hata oluştu!'); }
    }

    async function generateKey() {
      const count = document.getElementById('rights-count').value;
      const res = await fetch('/api/admin/generate-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminToken },
        body: JSON.stringify({ rights: parseInt(count) })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('modal-key-val').innerText = data.key;
        document.getElementById('copy-btn-text').innerText = "📋 Kopyala";
        document.getElementById('key-modal').style.display = 'flex';
        loadKeys();
      }
    }

    async function deleteKey(key) {
      if (!confirm(`"${key}" kodunu silmek istediğine emin misin?`)) return;
      await fetch('/api/admin/delete-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminToken },
        body: JSON.stringify({ key })
      });
      loadKeys();
    }

    function copyModalKey() {
      const val = document.getElementById('modal-key-val').innerText;
      copyText(val);
      document.getElementById('copy-btn-text').innerText = "✅ Kopyalandı!";
    }

    function closeModal() {
      document.getElementById('key-modal').style.display = 'none';
    }

    function copyText(text) {
      const input = document.createElement("textarea");
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
    }

    document.getElementById('login-form').style.display = 'block';
  </script>
</body>
</html>
