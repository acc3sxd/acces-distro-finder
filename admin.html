<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #090d16; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .login-box {
      background: #111827;
      padding: 40px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .login-box h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f8fafc; }
    
    .input-group { text-align: left; margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #374151;
      background-color: #030712;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #38bdf8; }

    .btn-login {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #0ea5e9; }

    /* PANEL İÇERİĞİ */
    .admin-container {
      background-color: #111827;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 700px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #1f2937; }
    .admin-header h2 { font-size: 18px; color: #38bdf8; }

    .gen-section {
      background: #030712;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .gen-section .input-group { margin-bottom: 0; flex: 1; }
    .btn-gen { padding: 12px 20px; background: #22c55e; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-gen:hover { background: #16a34a; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1f2937; font-size: 13px; }
    th { color: #94a3b8; font-weight: 500; }
    td { color: #e2e8f0; }

    .action-btn { padding: 6px 10px; border-radius: 6px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; margin-right: 4px; }
    .btn-c { background: #1f2937; color: #38bdf8; }
    .btn-c:hover { background: #374151; }
    .btn-d { background: #7f1d1d; color: #fca5a5; }
    .btn-d:hover { background: #991b1b; }

    #login-screen, #dashboard-screen { display: none; }

    /* ŞIK POPUP */
    .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content:center; align-items:center; z-index:999; }
    .modal-card { background: #111827; padding: 30px; border-radius: 16px; border: 1px solid #374151; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
    .modal-card h3 { color: #22c55e; margin-bottom: 12px; font-size: 18px; }
    .key-display { background: #030712; color: #38bdf8; font-family: monospace; font-size: 18px; padding: 14px; margin: 16px 0; border-radius: 8px; border: 1px dashed #374151; user-select: all; font-weight: bold; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div class="login-box" id="login-screen">
    <h1>🔐 Yönetici Girişi</h1>
    <div class="input-group">
      <label>Admin Şifresi</label>
      <input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="btn-login" onclick="login()">Giriş Yap</button>
  </div>

  <!-- PANEL EKRANI -->
  <div class="admin-container" id="dashboard-screen">
    <div class="admin-header">
      <h2>🛡️ Lisans Yönetim Paneli</h2>
      <button class="action-btn btn-d" onclick="location.reload()">Çıkış Yap</button>
    </div>

    <div class="gen-section">
      <div class="input-group">
        <label>Sorgu Hakkı</label>
        <input type="number" id="rights-count" value="100">
      </div>
      <button class="btn-gen" onclick="generateKey()">+ Yeni Key Üret</button>
    </div>

    <div>
      <h3 style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Aktif Lisanslar</h3>
      <table>
        <thead>
          <tr><th>Key Kodu</th><th>Kalan Hak</th><th>İşlemler</th></tr>
        </thead>
        <tbody id="keys-table"></tbody>
      </table>
    </div>
  </div>

  <!-- POPUP -->
  <div class="modal-bg" id="key-modal">
    <div class="modal-card">
      <h3>🎉 Key Başarıyla Üretildi</h3>
      <p style="font-size: 13px; color: #94a3b8;">Müşteriye göndereceğiniz kod:</p>
      <div class="key-display" id="modal-key-val"></div>
      <button class="btn-login" onclick="copyModalKey()" id="copy-btn-text" style="margin-bottom: 8px;">📋 Kopyala</button>
      <button class="action-btn btn-c" style="width:100%; padding:10px;" onclick="closeModal()">Kapat</button>
    </div>
  </div>

  <script>
    let adminToken = '';

    function login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass !== '03omer07') {
        alert('Hatalı Şifre!');
        return;
      }
      adminToken = pass;
      loadKeys();
    }

    async function loadKeys() {
      try {
        const res = await fetch('/api/admin/keys', { headers: { 'x-admin-password': adminToken } });
        if (!res.ok) return alert('Hatalı Şifre!');
        
        const keys = await res.json();
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';

        const tbody = document.getElementById('keys-table');
        tbody.innerHTML = '';

        Object.keys(keys).forEach(key => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><code>${key}</code></td>
            <td>${keys[key]} Hak</td>
            <td>
              <button class="action-btn btn-c" onclick="copyText('${key}')">Kopyala</button>
              <button class="action-btn btn-d" onclick="deleteKey('${key}')">İptal Et</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) { alert('Bağlantı hatası!'); }
    }

    async function generateKey() {
      const count = document.getElementById('rights-count').value;
      const res = await fetch('/api/admin/generate-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminToken },
        body: JSON.stringify({ rights: parseInt(count) })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('modal-key-val').innerText = data.key;
        document.getElementById('copy-btn-text').innerText = "📋 Kopyala";
        document.getElementById('key-modal').style.display = 'flex';
        loadKeys();
      }
    }

    async function deleteKey(key) {
      if (!confirm(`"${key}" kodunu iptal etmek istediğine emin misin?`)) return;
      await fetch('/api/admin/delete-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminToken },
        body: JSON.stringify({ key })
      });
      loadKeys();
    }

    function copyModalKey() {
      const val = document.getElementById('modal-key-val').innerText;
      copyText(val);
      document.getElementById('copy-btn-text').innerText = "✅ Kopyalandı!";
    }

    function closeModal() {
      document.getElementById('key-modal').style.display = 'none';
    }

    function copyText(text) {
      const input = document.createElement("textarea");
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
    }

    document.getElementById('login-screen').style.display = 'flex';
  </script>
</body>
</html>
