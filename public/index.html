<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acces Distro Finder</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background-color: #161616; width: 100%; max-width: 500px; padding: 30px; border-radius: 14px; border: 1px solid #2a1a1a; box-shadow: 0 10px 30px rgba(229, 9, 20, 0.15); }
    h1 { color: #e50914; font-size: 24px; text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 800; letter-spacing: -0.5px; }
    input[type="text"] { width: 100%; background-color: #222; color: #fff; border: 1px solid #3a2222; padding: 14px; border-radius: 8px; outline: none; margin-bottom: 14px; font-size: 14px; transition: 0.2s; }
    input:focus { border-color: #e50914; box-shadow: 0 0 8px rgba(229, 9, 20, 0.4); }
    button { width: 100%; background-color: #e50914; color: #fff; border: none; padding: 14px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); }
    button:hover { background-color: #ff1e27; transform: translateY(-1px); }
    #loader { display: none; text-align: center; color: #ff4d4d; font-size: 13px; margin-top: 15px; font-weight: 600; }
    #result { display: none; margin-top: 25px; padding: 20px; background-color: #201a1a; border-radius: 10px; border: 1px solid #3d2222; }
    .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .distro-value { color: #ff2a2a; font-weight: bold; font-size: 16px; text-align: right; }
    .err { color: #ff5555; text-align: center; font-size: 13px; margin-top: 12px; display: none; background: rgba(255, 0, 0, 0.1); padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎧 Acces Distro Finder</h1>

    <input type="text" id="url" placeholder="https://open.spotify.com/track/...">
    <button onclick="checkDistro()">Distribütörü Yakala</button>
    
    <div id="loader">🌐 Multi-API (Spotify, Deezer, MusicBrainz) Taranıyor...</div>
    <div id="err" class="err"></div>

    <div id="result">
      <div class="row"><span>Şarkı:</span><span id="sTitle" style="color:#fff; font-weight:bold;"></span></div>
      <div class="row"><span>Sanatçı:</span><span id="sArtist" style="color:#bbb"></span></div>
      <hr style="border-color:#3d2222; margin:12px 0;">
      <div class="row"><span>Gerçek Distribütör:</span><span id="sDistro" class="distro-value"></span></div>
      <div class="row"><span>ISRC Kodu:</span><span id="sIsrc" style="color:#bbb; font-family:monospace"></span></div>
      <div class="row"><span>Barkod (UPC/EAN):</span><span id="sUpc" style="color:#bbb; font-family:monospace"></span></div>
      <div class="row"><span>Telif / Label:</span><span id="sLabel" style="color:#aaa; font-size:12px"></span></div>
      <div class="row"><span>Tespit Kaynağı:</span><span id="sSource" style="color:#888; font-size:11px"></span></div>
    </div>
  </div>

  <script>
    const fallbackPrefixes = [
      { code: 'QT5M', name: 'FreshTunes' },
      { code: 'QT8BW', name: 'FreshTunes' },
      { code: 'PL4K', name: 'Believe Digital (Poland Branch)' },
      { code: 'PL', name: 'Polonya Bağımsız Dağıtım Ağı' },
      { code: 'QZME', name: 'DistroKid' },
      { code: 'QZFY', name: 'DistroKid' },
      { code: 'QZNW', name: 'DistroKid' },
      { code: 'QZHN', name: 'DistroKid / SoundDrop' },
      { code: 'QZ88', name: 'DistroKid' },
      { code: 'QZ99', name: 'DistroKid' },
      { code: 'EEHM', name: 'Estonia Regional / Independent Distro Network' },
      { code: 'USCG', name: 'TuneCore' },
      { code: 'USL4', name: 'TuneCore' },
      { code: 'GBA9', name: 'TuneCore UK' },
      { code: 'US2S', name: 'CD Baby' },
      { code: 'USHM', name: 'CD Baby' },
      { code: 'FR6X', name: 'Believe Digital' },
      { code: 'DEKB', name: 'Kontor New Media / Feiyr' },
      { code: 'SE6', name: 'Amuse' },
      { code: 'USUY', name: 'ONErpm' },
      { code: 'BR1', name: 'ONErpm Brazil' },
      { code: 'GBL7', name: 'AWAL / Kobalt' },
      { code: 'CA5', name: 'LANDR Music' },
      { code: 'US38', name: 'UnitedMasters' },
      { code: 'USH3', name: 'STEM Distribution' },
      { code: 'USX9', name: 'Symphonic Distribution' },
      { code: 'US95', name: 'SoundOn (TikTok)' },
      { code: 'QT', name: 'FreshTunes / Independent Gateway' },
      { code: 'QZ', name: 'DistroKid / Custom Registry' },
      { code: 'QA', name: 'Amuse / Custom Digital Distro' },
      { code: 'QX', name: 'Symphonic / Gateway' },
      { code: 'TC', name: 'TuneCore' },
      { code: 'SE', name: 'Amuse Sweden' },
      { code: 'EE', name: 'Estonya / Baltic Registry' },
      { code: 'FR', name: 'Believe Digital France' },
      { code: 'GB', name: 'Ditto Music / AWAL UK' },
      { code: 'NL', name: 'FUGA Distribution' },
      { code: 'UK', name: 'RouteNote' },
      { code: 'TR', name: 'Türkiye Dağıtım Network' }
    ];

    async function queryDeezer(isrc) {
      if (!isrc) return null;
      try {
        const res = await fetch(`https://api.deezer.com/2.0/track/isrc:${isrc}`);
        if (res.ok) {
          const data = await res.json();
          if (data.label) return { distro: data.label, source: "Deezer Public API" };
        }
      } catch (e) {
        console.warn("Deezer sorgu hatası:", e);
      }
      return null;
    }

    async function queryMusicBrainz(isrc, upc) {
      try {
        if (isrc) {
          const res = await fetch(`https://musicbrainz.org/ws/2/isrc/${isrc}?fmt=json&inc=releases+labels`, {
            headers: { 'User-Agent': 'AccesDistroFinder/2.0.0 (contact@example.com)' }
          });
          if (res.ok) {
            const data = await res.json();
            const label = data.releases?.[0]?.['label-info-list']?.[0]?.label?.name;
            if (label && label.toLowerCase() !== '[no label]') return { distro: label, source: "MusicBrainz API" };
          }
        }
        if (upc) {
          const resUpc = await fetch(`https://musicbrainz.org/ws/2/release?query=barcode:${upc}&fmt=json&inc=labels`, {
            headers: { 'User-Agent': 'AccesDistroFinder/2.0.0 (contact@example.com)' }
          });
          if (resUpc.ok) {
            const dataUpc = await resUpc.json();
            const label = dataUpc.releases?.[0]?.['label-info-list']?.[0]?.label?.name;
            if (label && label.toLowerCase() !== '[no label]') return { distro: label, source: "MusicBrainz UPC API" };
          }
        }
      } catch (e) {
        console.warn("MusicBrainz hatası:", e);
      }
      return null;
    }

    async function resolveDistro(isrc, labelText, upc) {
      const deezerResult = await queryDeezer(isrc);
      if (deezerResult) return deezerResult;

      const mbResult = await queryMusicBrainz(isrc, upc);
      if (mbResult) return mbResult;

      if (labelText) {
        const l = labelText.toLowerCase();
        if (l.includes('distrokid')) return { distro: 'DistroKid', source: 'Telif Analizi' };
        if (l.includes('tunecore')) return { distro: 'TuneCore', source: 'Telif Analizi' };
        if (l.includes('cd baby')) return { distro: 'CD Baby', source: 'Telif Analizi' };
        if (l.includes('believe')) return { distro: 'Believe Digital', source: 'Telif Analizi' };
        if (l.includes('amuse')) return { distro: 'Amuse', source: 'Telif Analizi' };
        if (l.includes('onerpm')) return { distro: 'ONErpm', source: 'Telif Analizi' };
        if (l.includes('fuga')) return { distro: 'FUGA', source: 'Telif Analizi' };
        if (l.includes('soundon')) return { distro: 'SoundOn', source: 'Telif Analizi' };
        if (l.includes('freshtunes')) return { distro: 'FreshTunes', source: 'Telif Analizi' };
        if (l.includes('routenote')) return { distro: 'RouteNote', source: 'Telif Analizi' };
      }

      if (isrc) {
        const cleanIsrc = isrc.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        for (const item of fallbackPrefixes) {
          if (cleanIsrc.startsWith(item.code)) {
            return { distro: item.name, source: `Prefix Eşleşmesi (${item.code})` };
          }
        }
        return { distro: `${cleanIsrc.substring(0, 2)} Dağıtım Ağı`, source: 'ISRC Ülke Kodu' };
      }

      return { distro: "Bilinmeyen Distribütör", source: "Veri Yok" };
    }

    async function checkDistro() {
      const urlInput = document.getElementById('url').value.trim();
      const err = document.getElementById('err');
      const loader = document.getElementById('loader');
      const resDiv = document.getElementById('result');
      
      err.style.display = 'none';
      resDiv.style.display = 'none';
      loader.style.display = 'block';

      const match = urlInput.match(/track[\/:]([a-zA-Z0-9]{22})/);
      if(!match) {
        loader.style.display = 'none';
        err.innerText = "Geçersiz Spotify Linki!";
        err.style.display = 'block';
        return;
      }

      try {
        const trackId = match[1];

        const response = await fetch('/api/check-distro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ trackId })
        });
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.message);
        }

        const tData = data.track;
        const pLine = tData.copyrights.find(c => c.type === 'P')?.text || "";
        const cLine = tData.copyrights.find(c => c.type === 'C')?.text || "";
        const combinedLabel = `${tData.label || ''} ${pLine} ${cLine}`;

        const result = await resolveDistro(tData.isrc, combinedLabel, tData.upc);

        document.getElementById('sTitle').innerText = tData.name;
        document.getElementById('sArtist').innerText = tData.artists;
        document.getElementById('sDistro').innerText = result.distro;
        document.getElementById('sIsrc').innerText = tData.isrc || "Yok";
        document.getElementById('sUpc').innerText = tData.upc || "Yok";
        document.getElementById('sLabel').innerText = tData.label || "Girilmemiş";
        document.getElementById('sSource').innerText = result.source;

        loader.style.display = 'none';
        resDiv.style.display = 'block';
      } catch (e) {
        loader.style.display = 'none';
        err.innerText = "Sorgulama esnasında hata oluştu!";
        err.style.display = 'block';
      }
    }
  </script>
</body>
</html>
