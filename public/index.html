<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dağıtım Bulucu & Sorgu Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #090d16; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card {
      background: #111827;
      padding: 40px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    
    .input-group { text-align: left; margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #374151;
      background-color: #030712;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #38bdf8; }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #0ea5e9; }
    .btn-success { background-color: #22c55e; color: #fff; }
    .btn-success:hover { background-color: #16a34a; }

    .info-box { background: #030712; padding: 16px; border-radius: 10px; border: 1px solid #1f2937; margin-bottom: 20px; text-align: left; }
    .info-box div { font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
    .info-box span { color: #38bdf8; font-weight: bold; }

    #app-screen, #login-screen { display: none; }
    .error-msg { color: #fca5a5; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <!-- GİRİŞ (KEY KONTROL) EKRANI -->
  <div class="card" id="login-screen">
    <h1>🔑 Lisans Girişi</h1>
    <p class="sub">Devam etmek için size verilen key kodunu girin.</p>
    <div class="input-group">
      <label>Lisans Key Kodu</label>
      <input type="text" id="license-key" placeholder="Key kodunuzu girin...">
    </div>
    <button class="btn" onclick="checkKey()">Giriş Yap</button>
    <div class="error-msg" id="login-error">Geçersiz veya süresi bitmiş key!</div>
  </div>

  <!-- UYGULAMA / SORGULAMA EKRANI -->
  <div class="card" id="app-screen" style="max-width: 600px;">
    <h1>🚀 Sorgu Paneli</h1>
    <p class="sub">Sistem aktif ve kullanıma hazır.</p>
    
    <div class="info-box">
      <div>Kullanılan Key: <span id="txt-key">-</span></div>
      <div>Kalan Sorgu Hakkı: <span id="txt-rights">0</span></div>
    </div>

    <div class="input-group">
      <label>Sorgulanacak Değer / Veri</label>
      <input type="text" id="query-input" placeholder="Sorgulamak istediğiniz veriyi yazın...">
    </div>
    <button class="btn btn-success" onclick="makeQuery()">Sorgula</button>
    <div id="result-area" style="margin-top: 15px; text-align: left; font-size: 13px; color: #38bdf8;"></div>
  </div>

  <script>
    let currentKey = localStorage.getItem('user_key') || '';

    if (currentKey) {
      verifyAndOpen(currentKey);
    } else {
      document.getElementById('login-screen').style.display = 'block';
    }

    async function checkKey() {
      const key = document.getElementById('license-key').value.trim();
      if (!key) return;

      verifyAndOpen(key);
    }

    async function verifyAndOpen(key) {
      try {
        const res = await fetch('/api/check-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await res.json();

        if (data.success) {
          currentKey = key;
          localStorage.setItem('user_key', key);
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';
          document.getElementById('txt-key').innerText = key;
          document.getElementById('txt-rights').innerText = data.rights;
        } else {
          localStorage.removeItem('user_key');
          document.getElementById('login-screen').style.display = 'block';
          document.getElementById('login-error').style.display = 'block';
        }
      } catch (err) {
        alert('Sunucu bağlantı hatası!');
      }
    }

    async function makeQuery() {
      const query = document.getElementById('query-input').value;
      const res = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: currentKey, query })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('txt-rights').innerText = data.remainingRights;
        document.getElementById('result-area').innerText = "Sonuç: " + JSON.stringify(data.result);
      } else {
        alert(data.message || 'Sorgu başarısız!');
      }
    }
  </script>
</body>
</html>
